[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mapping_tese"
version = "0.1.0"
description = "Somatosensory Mapping Thesis"
authors = [{ name = "Duarte Fonte-Santa" }]
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "seaborn",
    "torch",
    "torch_geometric",
    "nilearn",
    "nibabel",
    "shap",
    "pingouin",
    "plotly",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mapping_tese*"]

[tool.pytest.ini_options]
testpaths = ["tests"]